name: Deploy na Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Gerar build
        run: npm run build

      - name: Raio-X das pastas
        run: |
          echo "--- RAIZ DO PROJETO ---"
          ls -la
          echo "--- DENTRO DA PASTA DIST ---"
          ls -la dist/ || echo "Pasta dist vazia ou inexistente"
          echo "--- PROCURANDO INDEX.HTML ---"
          find . -name "index.html"

      - name: Enviar arquivos via LFTP
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -c "
            set ftp:ssl-allow no;
            open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' ${{ secrets.FTP_SERVER }};
            mirror -R ./dist/ ./dextank/ --parallel=5 --verbose;
          "
